target: all
multitenancy_enabled: false
server:
  http_listen_port: 9009
ingest_storage:
  enabled: false
common:
  storage:
    backend: s3
    s3:
      endpoint: s3:9000
      region: us-east-1
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      insecure: true
blocks_storage:
  s3:
    bucket_name: vcroles-mimir
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync
ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory
distributor:
  ring:
    kvstore:
      store: inmemory
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: inmemory
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory
ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler
alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/alertmanager
limits:
  compactor_blocks_retention_period: 7d
  ingestion_rate: 20000
  ingestion_burst_size: 40000
  max_global_series_per_user: 100000
  max_global_exemplars_per_user: 10000
usage_stats:
  enabled: false
