target: all
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      endpoint: s3:9000
      region: us-east-1
      bucket: vcroles-tempo
      access_key: ${S3_ACCESS_KEY}
      secret_key: ${S3_SECRET_KEY}
      insecure: true
      forcepathstyle: true
live_store:
  wal:
    path: /var/tempo/live-store
overrides:
  defaults:
    compaction:
      block_retention: 168h
usage_report:
  reporting_enabled: false
