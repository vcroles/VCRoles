auth_enabled: false
server:
  http_listen_port: 3100
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  aws:
    endpoint: s3:9000
    region: us-east-1
    bucketnames: vcroles-loki
    access_key_id: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_KEY}
    insecure: true
    s3forcepathstyle: true
ingester:
  wal:
    enabled: true
    dir: /loki/wal
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
  retention_delete_delay: 15m
  retention_delete_worker_count: 5
limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_global_streams_per_user: 5000
  max_query_parallelism: 2
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: structured_metadata
          attributes: [service.instance.id]
analytics:
  reporting_enabled: false
