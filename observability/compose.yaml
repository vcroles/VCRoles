name: vcroles-observability

x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"
  networks: [telemetry]

services:
  bootstrap:
    image: rustfs/rc@sha256:7e93fd410a8fe51514f89373e093392c92095b98dc6140335fcfe956810c4c80
    profiles: [tools]
    entrypoint: [/bin/sh, /bootstrap.sh]
    environment:
      HOME: /tmp
      S3_ROOT_ACCESS_KEY: ${S3_ROOT_ACCESS_KEY:?Run scripts/init.py first}
      S3_ROOT_SECRET_KEY: ${S3_ROOT_SECRET_KEY:?Run scripts/init.py first}
    volumes:
      - ./scripts/bootstrap.sh:/bootstrap.sh:ro
      - ./policies:/policies:ro
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [telemetry]
    mem_limit: 256m
    cpus: 0.25

  s3:
    <<: *runtime
    image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    user: "10001:10001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_ACCESS_KEY:?Run scripts/init.py first}
      RUSTFS_SECRET_KEY: ${S3_ROOT_SECRET_KEY:?Run scripts/init.py first}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_OBS_LOG_KEEP_FILES: "3"
      RUSTFS_OBS_LOG_ROTATION_TIME: hourly
      RUSTFS_OBS_LOG_MAX_TOTAL_SIZE_BYTES: "67108864"
      RUSTFS_OBS_ENDPOINT: http://storage-collector:14318
      RUSTFS_OBS_SERVICE_NAME: vcroles-storage
      RUSTFS_OBS_ENVIRONMENT: observability
      RUSTFS_OBS_METRICS_EXPORT_ENABLED: "true"
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_METER_INTERVAL: "30"
    volumes:
      - ${DATA_DIR:-./data}/s3:/data
      - ${DATA_DIR:-./data}/s3-logs:/logs
    ports: ["127.0.0.1:19000:9000"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 0.75

  loki:
    <<: *runtime
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    user: "10001:10001"
    command: [-config.file=/etc/loki/config.yaml, -config.expand-env=true]
    environment:
      S3_ACCESS_KEY: vcroles-loki
      S3_SECRET_KEY: ${LOKI_S3_SECRET_KEY:?Run scripts/init.py first}
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - ${DATA_DIR:-./data}/loki:/loki
    ports: ["127.0.0.1:13100:3100"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 0.75

  tempo:
    <<: *runtime
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    user: "10001:10001"
    working_dir: /var/tempo
    command: [-config.file=/etc/tempo/config.yaml, -config.expand-env=true]
    environment:
      S3_ACCESS_KEY: vcroles-tempo
      S3_SECRET_KEY: ${TEMPO_S3_SECRET_KEY:?Run scripts/init.py first}
    volumes:
      - ./config/tempo.yaml:/etc/tempo/config.yaml:ro
      - ${DATA_DIR:-./data}/tempo:/var/tempo
    ports: ["127.0.0.1:13200:3200"]
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 1.0

  mimir:
    <<: *runtime
    image: grafana/mimir:3.2.5@sha256:245ce851e2f5d27db6bd37720d9ab12bcb017f4b4e20340d9b58266435dbe4b6
    user: "10001:10001"
    working_dir: /data
    command: [-config.file=/etc/mimir/config.yaml, -config.expand-env=true]
    environment:
      S3_ACCESS_KEY: vcroles-mimir
      S3_SECRET_KEY: ${MIMIR_S3_SECRET_KEY:?Run scripts/init.py first}
    volumes:
      - ./config/mimir.yaml:/etc/mimir/config.yaml:ro
      - ${DATA_DIR:-./data}/mimir:/data
    ports: ["127.0.0.1:19009:9009"]
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 0.75

  alloy:
    <<: *runtime
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    user: "10001:10001"
    environment:
      OTLP_HTPASSWD: ${OTLP_HTPASSWD:?Run scripts/init.py --upgrade-otlp-auth for an existing deployment}
    networks:
      telemetry:
        aliases: [storage-collector]
      ingest:
        aliases: [vcroles-collector]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./config/alloy.alloy:/etc/alloy/config.alloy:ro
      - ${DATA_DIR:-./data}/alloy:/var/lib/alloy
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.5

  grafana:
    <<: *runtime
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/init.py first}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins-pinned
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3300}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_DIR:-./data}/grafana:/var/lib/grafana
    ports: ["${GRAFANA_BIND_IP:-127.0.0.1}:3300:3000"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.5

networks:
  ingest:
    # Attach only the bot at deployment time; the backends remain separate.
    internal: true
  telemetry:
    # A private bridge, with host access restricted by each explicit bind above.
    # Docker's internal=true suppresses published ports, including loopback.
    driver: bridge
