# Optional host metrics agent. Start with both Compose files; never manages the bot.
services:
  metrics-agent:
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    restart: unless-stopped
    init: true
    user: "0:0"
    network_mode: host
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    env_file:
      - path: ./.metrics.env
        format: raw
    command:
      - run
      - /etc/alloy/metrics.alloy
      - --storage.path=/var/lib/alloy-metrics
      - --server.http.listen-addr=127.0.0.1:12346
      - --disable-reporting
    volumes:
      - ./config/metrics.alloy:/etc/alloy/metrics.alloy:ro
      - ${DATA_DIR:-./data}/metrics-agent:/var/lib/alloy-metrics
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker:/var/lib/docker:ro
    tmpfs: [/tmp]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
